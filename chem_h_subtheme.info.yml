name: ChEM-H Subtheme
type: theme
description: 'ChEM-H Subtheme.'
package: Stanford
version: 2.3.8
core_version_requirement: ^10 || ^11
base theme: stanford_basic
libraries:
  - chem_h_subtheme/allpages
  - chem_h_subtheme/decoupled_menu

libraries-override:
  stanford_basic/decoupled_menu:  chem_h_subtheme/decoupled_menu

components:
  namespaces:
    chemh: templates
    chemh_subtheme: templates/components

regions:
  page_top: 'Page top'
  header: Header
  search: Search
  menu: Menu
  help: Help
  content: Content
  footer: Footer
  page_bottom: 'Page bottom'
